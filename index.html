<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Abkant Büküm Takip Sistemi</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 10px; }
        .aciklama { text-align: center; color: white; margin-bottom: 30px; font-size: 0.9em; }
        
        .anlik {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .sayi { font-size: 6em; font-weight: bold; color: #667eea; }
        .zaman { color: #666; margin-top: 10px; }
        .pedal-durum { background: #ff6b6b; color: white; border-radius: 10px; padding: 10px; margin-top: 10px; }
        .bekle-durum { background: #f0f0f0; color: #666; border-radius: 10px; padding: 10px; margin-top: 10px; }
        
        .ozet {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .ozet h3 { margin-bottom: 15px; color: #333; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; cursor: pointer; }
        th:hover { background: #5a67d8; }
        button {
            background: #667eea; color: white; border: none;
            padding: 5px 15px; border-radius: 10px; cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        
        .detay {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .detay h4 { color: #667eea; margin-bottom: 10px; }
        .detay-listesi { list-style: none; padding: 0; }
        .detay-listesi li { 
            padding: 8px; 
            border-bottom: 1px solid #ddd; 
            font-family: monospace;
            font-size: 14px;
        }
        .detay-listesi li:nth-child(even) { background: #f0f0f0; }
        
        .tarih-secici { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        .tarih-secici input { padding: 10px; border-radius: 10px; border: 1px solid #ddd; flex: 1; min-width: 150px; }
        
        .footer { text-align: center; color: white; margin-top: 20px; font-size: 0.8em; }
        .yenile-btn {
            background: white; color: #667eea; border: none;
            padding: 8px 16px; border-radius: 10px; cursor: pointer;
            margin: 5px; font-weight: bold;
        }
        .yenile-btn:hover { background: #f0f0f0; }
        .toplam-bilgi {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .canli-bilgi {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.8em;
            margin-top: 5px;
        }
        .yukleniyor {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Abkant Büküm Makinesi</h1>
        <div class="aciklama">📡 Gerçek Zamanlı Takip Sistemi | Anlık + Özet + Detay</div>
        
        <div style="text-align: center;">
            <button class="yenile-btn" onclick="verileriYenile()">🔄 VERİLERİ YENİLE</button>
            <button class="yenile-btn" onclick="tumunuGoster()" style="background:#2ecc71;color:white;">📊 TÜMÜNÜ GÖSTER</button>
        </div>
        
        <div class="anlik">
            <h3>🚀 ANLIK PEDAL SAYACI</h3>
            <div class="sayi" id="anlikSayac">0</div>
            <div class="zaman" id="anlikZaman">Yükleniyor...</div>
            <div id="anlikDurum" class="bekle-durum">⏳ BEKLEMEDE</div>
            <div id="canliBilgi" class="canli-bilgi">🟢 Canlı Bağlantı Aktif</div>
        </div>
        
        <div class="ozet">
            <h3>📊 TÜM GÜNLER</h3>
            <div class="tarih-secici">
                <input type="date" id="tarihSecici">
                <button onclick="tarihSec()">📅 TARİH SEÇ</button>
                <button onclick="tumunuGoster()" style="background:#2ecc71;">📋 TÜMÜ</button>
            </div>
            <div id="toplamBilgi" class="toplam-bilgi"></div>
            <table id="ozetTablo">
                <thead>
                    <tr>
                        <th onclick="siralaTarih()">Tarih 📅</th>
                        <th>Toplam Pedal</th>
                        <th>Basım Sayısı</th>
                        <th>Detay</th>
                    </tr>
                </thead>
                <tbody id="ozetBody">
                    <tr><td colspan="4" style="text-align:center">⏳ Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div id="detayPanel" class="detay" style="display:none;">
            <h4 id="detayTarih"></h4>
            <ul id="detayListesi" class="detay-listesi"></ul>
        </div>
        
        <div class="footer">
            Canlı Takip | Tüm veriler Firebase'de saklanır | Her basım kaydedilir
        </div>
    </div>

    <script>
        // ============ FIREBASE KONFIG ============
        const firebaseConfig = {
            apiKey: "AIzaSyD-wX1t7jMkYWG_1NpbDnQsgjVc9khrIVk",
            authDomain: "abkant3-e42bd.firebaseapp.com",
            databaseURL: "https://abkant3-e42bd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "abkant3-e42bd",
            storageBucket: "abkant3-e42bd.firebasestorage.app",
            messagingSenderId: "572801351430",
            appId: "1:572801351430:web:c0cf32574991d48b6d2887"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tumGunlukVerisi = {};

        // ============ ANLIK VERİ ============
        db.ref('/pedal').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.sayac !== undefined) {
                document.getElementById('anlikSayac').innerHTML = data.sayac;
                document.getElementById('anlikZaman').innerHTML = `🕐 ${new Date().toLocaleString('tr-TR')}`;
                document.getElementById('anlikDurum').innerHTML = "✅ PEDAL BASILDI";
                document.getElementById('anlikDurum').className = "pedal-durum";
                
                setTimeout(() => {
                    if (document.getElementById('anlikSayac').innerHTML == data.sayac) {
                        document.getElementById('anlikDurum').innerHTML = "⏳ BEKLEMEDE";
                        document.getElementById('anlikDurum').className = "bekle-durum";
                    }
                }, 2000);
            }
        });

        // ============ GÜNLÜK VERİLERİ DİNLE ============
        db.ref('/gunluk').on('value', (snapshot) => {
            const veri = snapshot.val();
            if (veri) {
                tumGunlukVerisi = veri;
                tabloyuDoldur(veri);
                guncelleToplamBilgi(veri);
            }
        });

        // ============ FIREBASE'DEN TÜM VERİLERİ ÇEK ============
        async function verileriYenile() {
            document.getElementById('ozetBody').innerHTML = '<tr><td colspan="4" style="text-align:center">⏳ Yükleniyor...</td></tr>';
            document.getElementById('detayPanel').style.display = 'none';
            
            try {
                const snapshot = await db.ref('/gunluk').once('value');
                const veri = snapshot.val() || {};
                tumGunlukVerisi = veri;
                
                if (Object.keys(veri).length === 0) {
                    document.getElementById('ozetBody').innerHTML = '<tr><td colspan="4" style="text-align:center">❌ Henüz kayıt yok</td></tr>';
                    document.getElementById('toplamBilgi').innerHTML = '📊 Toplam kayıtlı gün: 0';
                    return;
                }
                
                tabloyuDoldur(veri);
                guncelleToplamBilgi(veri);
                document.getElementById('anlikZaman').innerHTML = `🕐 ${new Date().toLocaleString('tr-TR')}`;
                
            } catch (error) {
                console.error('Firebase okuma hatası:', error);
                document.getElementById('ozetBody').innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">❌ Veri çekilemedi</td></tr>';
            }
        }

        // ============ TOPLAM BİLGİ ============
        function guncelleToplamBilgi(veri) {
            const gunSayisi = Object.keys(veri).length;
            let toplamBasim = 0;
            let toplamSayac = 0;
            
            for (let tarih in veri) {
                const gun = veri[tarih];
                if (gun.toplam && gun.toplam.sayac) {
                    toplamSayac += gun.toplam.sayac;
                }
                if (gun.basimlar) {
                    toplamBasim += Object.keys(gun.basimlar).length;
                }
            }
            
            document.getElementById('toplamBilgi').innerHTML = 
                `📊 Toplam ${gunSayisi} gün | Toplam ${toplamBasim} basım | Toplam ${toplamSayac} pedal`;
        }

        // ============ TABLOYU DOLDUR ============
        function tabloyuDoldur(veri) {
            const tbody = document.getElementById('ozetBody');
            tbody.innerHTML = '';
            
            const tarihler = Object.keys(veri).sort((a, b) => {
                const aParts = a.split('-');
                const bParts = b.split('-');
                const aDate = new Date(aParts[2], aParts[1] - 1, aParts[0]);
                const bDate = new Date(bParts[2], bParts[1] - 1, bParts[0]);
                return bDate - aDate;
            });
            
            for (let tarih of tarihler) {
                const gunVerisi = veri[tarih];
                const toplam = gunVerisi.toplam ? gunVerisi.toplam.sayac || 0 : 0;
                const basimSayisi = gunVerisi.basimlar ? Object.keys(gunVerisi.basimlar).length : 0;
                
                const row = tbody.insertRow();
                row.insertCell(0).innerHTML = tarih;
                row.insertCell(1).innerHTML = `<b>${toplam}</b>`;
                row.insertCell(2).innerHTML = basimSayisi;
                
                const btn = document.createElement('button');
                btn.innerHTML = '📋 Detay';
                btn.onclick = (function(t) { return function() { detayGoster(t); }; })(tarih);
                const cell = row.insertCell(3);
                cell.appendChild(btn);
            }
        }

        // ============ DETAY GÖSTER ============
        function detayGoster(tarih) {
            const panel = document.getElementById('detayPanel');
            const liste = document.getElementById('detayListesi');
            
            if (!tumGunlukVerisi[tarih]) {
                document.getElementById('detayTarih').innerHTML = `📅 ${tarih} - Veri bulunamadı`;
                liste.innerHTML = '<li>Bu güne ait kayıt yok</li>';
                panel.style.display = 'block';
                return;
            }
            
            const gunVerisi = tumGunlukVerisi[tarih];
            
            if (!gunVerisi.basimlar || Object.keys(gunVerisi.basimlar).length === 0) {
                document.getElementById('detayTarih').innerHTML = `📅 ${tarih} - Detay yok`;
                liste.innerHTML = '<li>Bu güne ait basım detayı yok</li>';
                panel.style.display = 'block';
                return;
            }
            
            const basimlarObj = gunVerisi.basimlar;
            const basimlar = Object.values(basimlarObj);
            basimlar.sort((a, b) => (a.sayac || 0) - (b.sayac || 0));
            
            const toplam = gunVerisi.toplam ? gunVerisi.toplam.sayac || 0 : 0;
            document.getElementById('detayTarih').innerHTML = 
                `📅 ${tarih} - Basım Detayları (Toplam: ${basimlar.length} basım, Son: ${toplam})`;
            
            liste.innerHTML = '';
            
            for (let b of basimlar) {
                const li = document.createElement('li');
                const saat = b.saat || '00:00:00';
                const sayac = b.sayac || 0;
                li.innerHTML = `🕐 ${saat} - <b>${sayac}</b>. basım`;
                liste.appendChild(li);
            }
            
            panel.style.display = 'block';
            panel.scrollIntoView({ behavior: 'smooth' });
        }

        // ============ TARİH SEÇ ============
        function tarihSec() {
            const secilen = document.getElementById('tarihSecici').value;
            if (!secilen) {
                alert('Lütfen bir tarih seçin!');
                return;
            }
            
            const parts = secilen.split('-');
            const tarihFormat = `${parts[2]}-${parts[1]}-${parts[0]}`;
            
            if (tumGunlukVerisi[tarihFormat]) {
                detayGoster(tarihFormat);
            } else {
                alert(`❌ ${tarihFormat} tarihine ait kayıt bulunamadı!`);
            }
        }

        // ============ TÜMÜNÜ GÖSTER ============
        function tumunuGoster() {
            if (Object.keys(tumGunlukVerisi).length === 0) {
                verileriYenile();
            } else {
                tabloyuDoldur(tumGunlukVerisi);
                document.getElementById('detayPanel').style.display = 'none';
            }
        }

        // ============ SIRALA ============
        function siralaTarih() {
            const tbody = document.getElementById('ozetBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            
            if (rows.length > 0 && rows[0].cells.length === 4) {
                rows.sort((a, b) => {
                    const tarihA = a.cells[0].innerText;
                    const tarihB = b.cells[0].innerText;
                    const aParts = tarihA.split('-');
                    const bParts = tarihB.split('-');
                    const aDate = new Date(aParts[2], aParts[1] - 1, aParts[0]);
                    const bDate = new Date(bParts[2], bParts[1] - 1, bParts[0]);
                    return bDate - aDate;
                });
                
                tbody.innerHTML = '';
                rows.forEach(row => tbody.appendChild(row));
            }
        }

        // ============ SAYFA YÜKLENİNCE ============
        window.onload = function() {
            const bugun = new Date();
            const yil = bugun.getFullYear();
            const ay = String(bugun.getMonth() + 1).padStart(2, '0');
            const gun = String(bugun.getDate()).padStart(2, '0');
            document.getElementById('tarihSecici').value = `${yil}-${ay}-${gun}`;
            
            verileriYenile();
        };
    </script>
</body>
</html>
